<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Gym Simulator</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  #root {
    width: 100vw;
    height: 100dvh;
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ============================================
// CHARAKTERE
// Lade Dateien mit GENAU diesen Namen in dasselbe GitHub-Repo hoch,
// in dem auch diese index.html liegt (gleiche Ebene, kein Unterordner):
//
// char1-vorschau.JPG    char2-vorschau.JPG
// char1-standbild.JPG   char2-standbild.JPG
// char1-flex.JPG        char2-flex.JPG
// char1-benchpress-unten.JPG   char2-benchpress-unten.JPG
// char1-benchpress-oben.JPG    char2-benchpress-oben.JPG
// char1-squat-unten.JPG        char2-squat-unten.JPG
// char1-squat-oben.JPG         char2-squat-oben.JPG
// char1-pullup-unten.JPG       char2-pullup-unten.JPG
// char1-pullup-oben.JPG        char2-pullup-oben.JPG
//
// Kein Username/Repo mehr nötig - die Datei liegt ja im selben Repo,
// deshalb reicht der reine Dateiname als Pfad.
// ============================================
const characters = [
    {
        id: "char1",
        name: "Charakter 1",
        previewImage: "char1-vorschau.JPG",
        idleImage: "char1-standbild.JPG",
        flexImage: "char1-flex.JPG",
        exerciseImages: {
            benchpress: { down: "char1-benchpress-unten.JPG", up: "char1-benchpress-oben.JPG" },
            squat: { down: "char1-squat-unten.JPG", up: "char1-squat-oben.JPG" },
            pullup: { down: "char1-pullup-unten.JPG", up: "char1-pullup-oben.JPG" },
        },
    },
    {
        id: "char2",
        name: "Charakter 2",
        previewImage: "char2-vorschau.JPG",
        idleImage: "char2-standbild.JPG",
        flexImage: "char2-flex.JPG",
        exerciseImages: {
            benchpress: { down: "char2-benchpress-unten.JPG", up: "char2-benchpress-oben.JPG" },
            squat: { down: "char2-squat-unten.JPG", up: "char2-squat-oben.JPG" },
            pullup: { down: "char2-pullup-unten.JPG", up: "char2-pullup-oben.JPG" },
        },
    },
]

// ============================================
// HIER NEUE ÜBUNGEN HINZUFÜGEN
// id (eindeutig), name, und der Dateiname des Übergangs-Clips.
// Denk dran: für eine neue Übung brauchst du zusätzlich bei JEDEM
// Charakter oben einen exerciseImages-Eintrag mit der gleichen id,
// und musst die passenden Bild-Dateien hochladen.
// Der "name" ist die einzige Stelle, die du fürs Umbenennen ändern musst.
//
// Video-Dateien zum Hochladen: clip-benchpress.mp4, clip-squat.mp4,
// clip-pullup.mp4 (diese 3 sind für beide Charaktere gleich)
// ============================================
const exercises = [
    { id: "benchpress", name: "Bankdrücken", transitionClip: "clip-benchpress.mp4" },
    { id: "squat", name: "Kniebeuge", transitionClip: "clip-squat.mp4" },
    { id: "pullup", name: "Klimmzüge", transitionClip: "clip-pullup.mp4" },
]

// Diese Werte kannst du frei anpassen, um das Spielgefühl zu verändern
const PUMP_PRO_KLICK = 8 // wie viel die Leiste pro Klick steigt (0-100)
const ABSINKEN_PRO_TICK = 1 // wie viel die Leiste von selbst sinkt
const ABSINKEN_INTERVALL_MS = 200 // wie oft sie von selbst sinkt (alle 200ms)
const FLEX_SZENE_DAUER_MS = 1500 // wie lange die Flex-Szene sichtbar bleibt

function GymSimulator() {
    // Ob gerade der Charakterauswahl-Screen gezeigt wird.
    // Startet mit true, damit man vor dem ersten Betreten des Gyms wählen muss.
    const [zeigeCharakterauswahl, setZeigeCharakterauswahl] = useState(true)
    const [selectedCharacterId, setSelectedCharacterId] = useState(null)

    // Welche Übung gerade aktiv ist (man klickt/trainiert dort). null = keine, zeigt Standbild
    const [aktiveUebungId, setAktiveUebungId] = useState(null)
    // Welche Übung gerade im Übergangs-Clip läuft, bevor sie aktiv wird. null = kein Übergang gerade
    const [uebergangsUebungId, setUebergangsUebungId] = useState(null)
    // Toggle zwischen den zwei Bildern der aktiven Übung (eine Wiederholung = ein Umschalten)
    const [istObenPosition, setIstObenPosition] = useState(false)
    // Die Leiste, 0 bis 100
    const [pumpLevel, setPumpLevel] = useState(0)
    // Ob gerade die Flex-Szene läuft
    const [zeigeFlexSzene, setZeigeFlexSzene] = useState(false)

    const selectedCharacter = characters.find((c) => c.id === selectedCharacterId)
    const aktiveUebung = exercises.find((e) => e.id === aktiveUebungId)
    const uebergangsUebung = exercises.find((e) => e.id === uebergangsUebungId)

    // Die Leiste sinkt automatisch mit der Zeit, unabhängig vom Klicken.
    useEffect(() => {
        const interval = setInterval(() => {
            setPumpLevel((prev) => Math.max(0, prev - ABSINKEN_PRO_TICK))
        }, ABSINKEN_INTERVALL_MS)
        return () => clearInterval(interval)
    }, [])

    // Wird bei jedem Klick/Tap auf den Trainingsbereich aufgerufen
    function handleKlick() {
        if (!aktiveUebung) return // ohne aktive Übung passiert beim Klicken nichts

        setIstObenPosition((prev) => !prev) // Bild umschalten = eine Wiederholung ausführen

        setPumpLevel((prev) => {
            const neuerLevel = Math.min(100, prev + PUMP_PRO_KLICK)
            if (neuerLevel >= 100) {
                starteFlexSzene()
            }
            return neuerLevel
        })
    }

    function starteFlexSzene() {
        setZeigeFlexSzene(true)
        setTimeout(() => {
            setZeigeFlexSzene(false)
            setPumpLevel(0)
        }, FLEX_SZENE_DAUER_MS)
    }

    // Übung anwählen: startet erstmal den Übergangs-Clip, nicht direkt die Übung selbst
    function waehleUebung(id) {
        setUebergangsUebungId(id)
    }

    // Wird aufgerufen, wenn der Übergangs-Clip zu Ende gespielt hat
    function uebergangBeendet() {
        setAktiveUebungId(uebergangsUebungId)
        setUebergangsUebungId(null)
        setIstObenPosition(false)
        setPumpLevel(0)
    }

    function waehleCharakter(id) {
        setSelectedCharacterId(id)
        setZeigeCharakterauswahl(false)
    }

    // ============================================
    // CHARAKTERAUSWAHL-SCREEN
    // ============================================
    if (zeigeCharakterauswahl) {
        return (
            <div
                style={{
                    width: "100%",
                    height: "100%",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    gap: 24,
                    backgroundColor: "#111",
                    fontFamily: "system-ui, sans-serif",
                    padding: "env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px",
                    boxSizing: "border-box",
                }}
            >
                <h2 style={{ color: "white", margin: 0, fontSize: 20, textAlign: "center" }}>Charakter wählen</h2>
                <div style={{ display: "flex", gap: 16 }}>
                    {characters.map((c) => (
                        <button
                            key={c.id}
                            onClick={() => waehleCharakter(c.id)}
                            style={{
                                display: "flex",
                                flexDirection: "column",
                                alignItems: "center",
                                gap: 8,
                                padding: 12,
                                backgroundColor: selectedCharacterId === c.id ? "#ff4d4d" : "#2a2a2a",
                                border: "none",
                                borderRadius: 12,
                                cursor: "pointer",
                            }}
                        >
                            <img
                                src={c.previewImage}
                                alt={c.name}
                                style={{ width: 120, height: 120, objectFit: "cover", borderRadius: 8 }}
                            />
                            <span style={{ color: "white", fontSize: 14, fontWeight: 600 }}>{c.name}</span>
                        </button>
                    ))}
                </div>
            </div>
        )
    }

    // ============================================
    // ÜBERGANGS-CLIP
    // ============================================
    if (uebergangsUebung) {
        return (
            <video
                key={uebergangsUebung.id}
                src={uebergangsUebung.transitionClip}
                autoPlay
                muted
                playsInline
                onEnded={uebergangBeendet}
                style={{ width: "100%", height: "100%", objectFit: "cover", backgroundColor: "#000" }}
            />
        )
    }

    // Bestimmt, welches Bild im Trainingsbereich gerade angezeigt werden soll,
    // abhängig vom gewählten Charakter
    let aktuellesBild = selectedCharacter?.idleImage
    if (zeigeFlexSzene) {
        aktuellesBild = selectedCharacter?.flexImage
    } else if (aktiveUebung && selectedCharacter) {
        const bilder = selectedCharacter.exerciseImages[aktiveUebung.id]
        aktuellesBild = istObenPosition ? bilder.up : bilder.down
    }

    // ============================================
    // GYM-RAUM (Hauptansicht)
    // ============================================
    return (
        <div
            style={{
                width: "100%",
                height: "100%",
                position: "relative",
                display: "flex",
                flexDirection: "column",
                fontFamily: "system-ui, sans-serif",
            }}
        >
            {/* Trainingsbereich: hier wird geklickt/getappt */}
            <div
                onClick={handleKlick}
                style={{
                    flex: 1,
                    backgroundImage: `url(${aktuellesBild})`,
                    backgroundSize: "cover",
                    backgroundPosition: "center",
                    backgroundColor: "#1a1a1a",
                    cursor: aktiveUebung ? "pointer" : "default",
                    position: "relative",
                }}
            >
                {/* Aufgepumpt-Leiste am rechten Rand */}
                <div
                    style={{
                        position: "absolute",
                        right: 16,
                        top: 16,
                        bottom: 16,
                        width: 20,
                        backgroundColor: "rgba(0,0,0,0.35)",
                        borderRadius: 10,
                        overflow: "hidden",
                    }}
                >
                    <div
                        style={{
                            position: "absolute",
                            bottom: 0,
                            width: "100%",
                            height: `${pumpLevel}%`,
                            backgroundColor: "#ff4d4d",
                            transition: "height 0.1s linear",
                        }}
                    />
                </div>
            </div>

            {/* Buttons unten: Übungen wählen + Charakter wechseln */}
            <div
                style={{
                    display: "flex",
                    gap: 6,
                    padding: "10px 10px calc(10px + env(safe-area-inset-bottom)) 10px",
                    backgroundColor: "#111",
                    boxSizing: "border-box",
                }}
            >
                {exercises.map((ex) => (
                    <button
                        key={ex.id}
                        onClick={() => waehleUebung(ex.id)}
                        style={{
                            flex: 1,
                            minWidth: 0,
                            padding: "10px 2px",
                            backgroundColor: aktiveUebungId === ex.id ? "#ff4d4d" : "#2a2a2a",
                            color: "white",
                            border: "none",
                            borderRadius: 8,
                            fontSize: 12,
                            fontWeight: 600,
                            whiteSpace: "nowrap",
                            overflow: "hidden",
                            textOverflow: "ellipsis",
                        }}
                    >
                        {ex.name}
                    </button>
                ))}
                <button
                    onClick={() => setZeigeCharakterauswahl(true)}
                    style={{
                        flexShrink: 0,
                        padding: "10px 14px",
                        backgroundColor: "#2a2a2a",
                        color: "white",
                        border: "none",
                        borderRadius: 8,
                        fontSize: 16,
                    }}
                >
                    👤
                </button>
            </div>
        </div>
    )
}

const root = ReactDOM.createRoot(document.getElementById("root"))
root.render(<GymSimulator />)
</script>
</body>
</html>
